<svg width="100%" height="20" viewBox="0 0 900 20" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#88CE02" stop-opacity="0" />
      <stop offset="25%" stop-color="#88CE02" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="1" />
      <stop offset="75%" stop-color="#9d4edd" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0" />
    </linearGradient>
    <style>
      @keyframes pulseLine {
        0%, 100% { opacity: 0.4; transform: scaleY(0.8); }
        50% { opacity: 1; transform: scaleY(1.4); }
      }
      @keyframes sweepGlow {
        0% { transform: translateX(-400px); }
        100% { transform: translateX(900px); }
      }
      .lineBar { animation: pulseLine 3s ease-in-out infinite; transform-origin: center; }
      .glowPoint { animation: sweepGlow 4s linear infinite; }
    </style>
  </defs>
  <rect class="lineBar" x="100" y="9" width="700" height="2" rx="1" fill="url(#divGrad)" />
  <circle class="glowPoint" cx="0" cy="10" r="4" fill="#00F2FE" opacity="0.8" filter="drop-shadow(0 0 4px #00F2FE)" />
</svg>
