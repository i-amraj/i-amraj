<svg width="100%" height="240" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0d1224" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>

    <!-- Neon Accent Gradients -->
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#88CE02" />
      <stop offset="50%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>

    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#88CE02" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
        50% { transform: scale(1.15) translate(15px, -10px); opacity: 0.65; }
      }
      @keyframes pulseOrb2 {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
        50% { transform: scale(1.2) translate(-20px, 12px); opacity: 0.6; }
      }
      @keyframes laserScan {
        0% { transform: translateX(-900px); opacity: 0; }
        30% { opacity: 0.7; }
        70% { opacity: 0.7; }
        100% { transform: translateX(900px); opacity: 0; }
      }
      @keyframes waveFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes badgeGlow {
        0%, 100% { stroke-opacity: 0.3; }
        50% { stroke-opacity: 0.9; }
      }

      .orb1 { animation: pulseOrb 7s ease-in-out infinite; transform-origin: 180px 70px; }
      .orb2 { animation: pulseOrb2 8s ease-in-out infinite; transform-origin: 720px 170px; }
      .laser { animation: laserScan 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .floatingWave { animation: waveFloat 5s ease-in-out infinite; }
      .badgeBorder { animation: badgeGlow 3s ease-in-out infinite; }
      
      .mainTitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 900;
        font-size: 38px;
        letter-spacing: 4px;
      }
      .subTitle {
        font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 3px;
        fill: #94a3b8;
      }
      .badgeText {
        font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
        font-weight: 600;
        font-size: 10.5px;
        letter-spacing: 1.5px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Animated Glowing Atmospheric Orbs (Creative Canvas / GSAP Vibe) -->
  <circle class="orb1" cx="180" cy="70" r="110" fill="#88CE02" opacity="0.25" filter="url(#glowGreen)" />
  <circle class="orb2" cx="740" cy="160" r="130" fill="#00F2FE" opacity="0.2" filter="url(#glowCyan)" />
  <circle cx="450" cy="20" r="80" fill="#7928ca" opacity="0.15" filter="url(#glowCyan)" />

  <!-- Cyber Grid Lines -->
  <g stroke="#334155" stroke-opacity="0.18" stroke-width="1">
    <line x1="0" y1="40" x2="900" y2="40" />
    <line x1="0" y1="80" x2="900" y2="80" />
    <line x1="0" y1="120" x2="900" y2="120" />
    <line x1="0" y1="160" x2="900" y2="160" />
    <line x1="0" y1="200" x2="900" y2="200" />
    
    <line x1="150" y1="0" x2="150" y2="240" />
    <line x1="300" y1="0" x2="300" y2="240" />
    <line x1="450" y1="0" x2="450" y2="240" />
    <line x1="600" y1="0" x2="600" y2="240" />
    <line x1="750" y1="0" x2="750" y2="240" />
  </g>

  <!-- Animated Sine Wave (Visual Reveal Ripple) -->
  <g class="floatingWave" opacity="0.45">
    <path d="M 0 130 Q 150 100, 300 130 T 600 130 T 900 130" fill="none" stroke="url(#cyberNeon)" stroke-width="2" stroke-dasharray="6 4" />
    <path d="M 0 145 Q 150 175, 300 145 T 600 145 T 900 145" fill="none" stroke="#00F2FE" stroke-width="1.2" opacity="0.5" />
  </g>

  <!-- Laser Sweep Line -->
  <rect class="laser" x="0" y="0" width="180" height="240" fill="url(#laserGrad)" opacity="0.5" />

  <!-- Center Content -->
  <!-- Top Terminal Pill -->
  <g transform="translate(365, 24)">
    <rect width="170" height="22" rx="11" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="12" cy="11" r="3.5" fill="#88CE02" filter="url(#glowGreen)" />
    <text x="24" y="15" fill="#38bdf8" font-family="'SF Mono', monospace" font-size="9.5" font-weight="700" letter-spacing="1">SYSTEM ACTIVE // 2026</text>
  </g>

  <!-- Main Heading -->
  <g transform="translate(450, 96)">
    <text class="mainTitle" text-anchor="middle" fill="url(#cyberNeon)" filter="url(#glowCyan)">RAJ SONI</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(450, 132)">
    <text class="subTitle" text-anchor="middle">FULL-STACK ARCHITECT  •  CREATIVE TECH  •  AUTOMATION</text>
  </g>

  <!-- Glowing Badges Bar -->
  <g transform="translate(450, 182)">
    <!-- Badge 1: GSAP & Canvas -->
    <g transform="translate(-320, 0)">
      <rect class="badgeBorder" width="150" height="28" rx="6" fill="#0a0f1d" stroke="#88CE02" stroke-width="1.2" />
      <text class="badgeText" x="75" y="18" text-anchor="middle" fill="#88CE02">⚡ GSAP 3.12 & CANVAS</text>
    </g>

    <!-- Badge 2: Distributed Automation -->
    <g transform="translate(-155, 0)">
      <rect class="badgeBorder" width="155" height="28" rx="6" fill="#0a0f1d" stroke="#00F2FE" stroke-width="1.2" />
      <text class="badgeText" x="77" y="18" text-anchor="middle" fill="#00F2FE">🕷️ WEB AUTOMATION</text>
    </g>

    <!-- Badge 3: Scalable SaaS -->
    <g transform="translate(15, 0)">
      <rect class="badgeBorder" width="145" height="28" rx="6" fill="#0a0f1d" stroke="#a855f7" stroke-width="1.2" />
      <text class="badgeText" x="72" y="18" text-anchor="middle" fill="#c084fc">🚀 SAAS PLATFORMS</text>
    </g>

    <!-- Badge 4: AI Agents -->
    <g transform="translate(175, 0)">
      <rect class="badgeBorder" width="145" height="28" rx="6" fill="#0a0f1d" stroke="#38bdf8" stroke-width="1.2" />
      <text class="badgeText" x="72" y="18" text-anchor="middle" fill="#38bdf8">🤖 AI AGENTS & LLMS</text>
    </g>
  </g>

  <!-- Decorative Corner Accents -->
  <path d="M 12 28 L 12 12 L 28 12" stroke="#88CE02" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 888 28 L 888 12 L 872 12" stroke="#00F2FE" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 12 212 L 12 228 L 28 228" stroke="#00F2FE" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 888 212 L 888 228 L 872 228" stroke="#88CE02" stroke-width="2" fill="none" opacity="0.8" />
</svg>
